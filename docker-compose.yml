services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pizzastore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./PizzaStore
      dockerfile: Dockerfile
    container_name: pizzastore-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Pizzas: "Server=db;Database=PizzaStore;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;"
      Jwt__Key: "PizzaStoreSecretSecurityKeySuperLongJWTKey12345!"
      Jwt__Issuer: "PizzaStoreAPI"
      Jwt__Audience: "PizzaStoreClient"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata: